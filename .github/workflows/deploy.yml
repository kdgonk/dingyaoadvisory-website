name: Deploy to Cloudflare Workers

# 2026-10-19 泰坦人：GitHub Actions → wrangler deploy（不取代本機 wrangler）
# 階段 1：只允許手動觸發（workflow_dispatch）。驗證通過後才加 push 觸發。
# 注意：Worker secret CHATWOOT_API_TOKEN 存在 Cloudflare 端，部署不會清除。
# 階段 2（2026-10-19 驗證通過後）：加 push 觸發，push 到 main 即自動部署。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 2026-10-24 泰坦人：GA4 Measurement Protocol api_secret。
      # 放在 job env 才能在 step 的 if 裡判斷「有沒有設定」，未設定就不 sync（本機/分支不會壞）。
      GA4_MP_API_SECRET: ${{ secrets.GA4_MP_API_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GA4 Measurement Protocol secret
        if: env.GA4_MP_API_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: printf '%s' "$GA4_MP_API_SECRET" | npx --yes wrangler@4 secret put GA4_MP_API_SECRET --name dingyao

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          wranglerVersion: '4'
          command: deploy
